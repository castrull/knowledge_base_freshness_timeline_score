[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "castrull-vecdb_jd142"
version = "0.1.0"
description = "解析时间标记，排列向量数据库内核工程师·知识库的时效性维护的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "castrull" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://castrull.github.io"
Repository = "https://github.com/castrull/vecdb_jd142"
Issues = "https://github.com/castrull/vecdb_jd142/issues"

[project.scripts]
vecdb_jd142 = "vecdb_jd142:main"

[tool.setuptools]
py-modules = ["vecdb_jd142"]
